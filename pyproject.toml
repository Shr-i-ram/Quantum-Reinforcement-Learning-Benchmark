[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-rl-benchmark"
version = "0.1.0"
description = "Benchmarking Quantum vs Classical Reinforcement Learning across Increasingly Complex Gymnasium Environments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Shriram", email = "shriramng2016@gmail.com"}
]
keywords = [
    "quantum-computing",
    "reinforcement-learning",
    "variational-quantum-circuits",
    "pennylane",
    "pytorch",
    "gymnasium",
    "benchmarking",
    "q-learning",
    "ppo",
    "dqn",
    "sac"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "gymnasium[classic-control,box2d]>=0.29.0",
    "torch>=2.0.0",
    "pennylane>=0.35.0",
    "pennylane-lightning>=0.35.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
]

[project.scripts]
quantum-rl-benchmark = "run_experiment:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantum_rl_benchmark*"]
